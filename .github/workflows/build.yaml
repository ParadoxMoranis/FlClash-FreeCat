name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  IS_STABLE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
  # See CI Caches in .agents/commands.md.
  BRANCH_CACHE: ${{ !startsWith(github.ref, 'refs/tags/') }}
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  metadata:
    name: Release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package and tag versions
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          pubspec = pathlib.Path('pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*([^\s#]+)', pubspec, re.MULTILINE)
          if match is None:
              raise SystemExit('pubspec.yaml has no version')
          version = match.group(1).partition('+')[0]
          if re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?', version) is None:
              raise SystemExit(f'Unsupported release version: {version}')
          if '-' in version:
              identifiers = version.partition('-')[2].split('.')
              if any(value.isdigit() and len(value) > 1 and value.startswith('0') for value in identifiers):
                  raise SystemExit(f'Invalid SemVer prerelease identifiers: {version}')
          if os.environ['REF_TYPE'] == 'tag' and os.environ['REF_NAME'] != f'v{version}':
              raise SystemExit(f'Tag {os.environ["REF_NAME"]} must exactly match pubspec version v{version}; prerelease tags require the same prerelease in pubspec.yaml')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
          PY

  dart:
    name: Dart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Test git hooks
        run: bash tool/hooks/test.sh

      - name: Test AUR release generator
        run: python3 -m unittest discover -s test/tool -p release_aur_test.py

      - name: Install native Rust test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip the Go core build hook
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml

      - name: Verify changelog
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: dart run tool/changelog.dart verify

      - name: Run tests
        run: dart run tool/test.dart -- --reporter expanded --coverage

      - name: Check coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 75

  plugins:
    name: Plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Validate local Flutter packages
        run: bash tool/check_plugins.sh

      - name: Validate setup hooks package
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          dart analyze
          dart test

  go:
    name: Go core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Validate Go core wrapper
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          if ! compgen -G '*_test.go' > /dev/null; then
            echo 'No Go tests found in core/; the test step would pass vacuously.' >&2
            exit 1
          fi
          test -z "$(gofmt -l ./*.go ./cmd ./mobile ./platform ./timezone ./tun)" || {
            gofmt -l ./*.go ./cmd ./mobile ./platform ./timezone ./tun >&2
            exit 1
          }
          go test -count=1 .
          go vet . ./cmd/...
          GOOS=linux go vet ./platform

      - name: Validate the Android core library
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          tags="$(sed -n 's/^tags: *//p' ../build_config.yaml)"
          test -n "$tags" || { echo 'Could not read tags from build_config.yaml' >&2; exit 1; }
          GOOS=android GOARCH=arm64 go vet "-tags=$tags" . ./mobile ./tun ./platform

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: |
            core/go.sum
            android/core/build.gradle.kts

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Run Android unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          # No JVM unit test loads the Core or the Flutter build, but `:core` compiles against
          # the gomobile AAR, so one ABI of it is built.
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -Ptarget-platform=android-arm64 \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native Rust test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Check format
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Run tests
        run: |
          cargo test --manifest-path services/helper/Cargo.toml
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    name: Windows helper test
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/helper
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

  build:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    needs: metadata
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: macos-15-intel
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          - platform: windows
            os: windows-11-arm
            arch: arm64
            flutter-channel: master
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
            flutter-channel: master

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: startsWith(matrix.platform,'android')
        uses: gradle/actions/setup-gradle@v6

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      # Stable publishes no Windows or Linux arm64 archive; master makes the action
      # clone the SDK at the pinned tag and let it fetch the host's own Dart SDK.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Setup Xcode
        if: startsWith(matrix.platform,'macos')
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup NDK
        if: startsWith(matrix.platform,'android')
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup Android signing
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import pathlib

          required = ('KEYSTORE', 'KEY_ALIAS', 'STORE_PASSWORD', 'KEY_PASSWORD')
          complete = all(os.environ.get(name, '').strip() for name in required)
          keystore = pathlib.Path('android/app/keystore.jks')
          if complete:
              data = base64.b64decode(''.join(os.environ['KEYSTORE'].split()), validate=True)
              if not data:
                  raise SystemExit('KEYSTORE decoded to an empty file')
              keystore.write_bytes(data)

              def property_value(value):
                  encoded = value.encode('utf-16-be')
                  return ''.join('\\u%04x' % int.from_bytes(encoded[index:index + 2], 'big') for index in range(0, len(encoded), 2))

              names = {'keyAlias': 'KEY_ALIAS', 'storePassword': 'STORE_PASSWORD', 'keyPassword': 'KEY_PASSWORD'}
              with open('android/local.properties', 'a', encoding='ascii') as properties:
                  properties.write('\n')
                  for key, name in names.items():
                      properties.write(f'{key}={property_value(os.environ[name])}\n')
              message = 'Android APKs use the repository release signing key (com.follow.clash).'
          else:
              keystore.unlink(missing_ok=True)
              message = 'Android APKs use a temporary runner debug key and the com.follow.clash.dev application ID. This key can change between builds; a later APK may require uninstalling the earlier build. Configure KEYSTORE, KEY_ALIAS, STORE_PASSWORD and KEY_PASSWORD together for consistent release signing.'
              print(f'::warning::{message}')
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'ANDROID-SIGNING.txt').write_text(message + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(message + '\n')
          PY

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # See .agents/flutter-upgrade.md before bumping FLUTTER_VERSION.
      - name: Disable Impeller on Intel macOS
        if: matrix.platform == 'macos' && matrix.arch == 'amd64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist

      # The core embeds this bundle and FlClashHttpOverrides.trustCoreRoots loads it for Dart.
      # Pinned by hash, so a new bundle from https://curl.se/docs/caextract.html is a reviewed bump.
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Setup
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Assemble verified Linux bundle archive
        if: matrix.platform == 'linux'
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import tarfile

          arch = os.environ['ARCH']
          flutter_arch = {'amd64': 'x64', 'arm64': 'arm64'}[arch]
          bundle = pathlib.Path(f'build/linux/{flutter_arch}/release/bundle')
          for name in ('FlClash', 'FlClashCore', 'FlClashHelperService', 'manifest.json'):
              path = bundle / name
              if not path.is_file():
                  raise SystemExit(f'Missing Linux bundle file: {path}')
              if name != 'manifest.json' and not os.access(path, os.X_OK):
                  raise SystemExit(f'Linux executable lost its execute permission: {path}')
          for name in ('lib', 'data'):
              if not (bundle / name).is_dir():
                  raise SystemExit(f'Missing Linux bundle directory: {bundle / name}')

          def digest(path):
              result = hashlib.sha256()
              with path.open('rb') as source:
                  for block in iter(lambda: source.read(1024 * 1024), b''):
                      result.update(block)
              return result.hexdigest()

          manifest = json.loads((bundle / 'manifest.json').read_text(encoding='utf-8'))
          if manifest.get('coreSha256') != digest(bundle / 'FlClashCore'):
              raise SystemExit('Linux Core SHA256 does not match manifest.json')
          for name in ('FlClashCore', 'FlClashHelperService'):
              if digest(bundle / name) != digest(pathlib.Path('libclash/linux') / name):
                  raise SystemExit(f'Packaging changed {name}; the Core and Helper must retain their original bytes')
          archive = pathlib.Path('dist') / f'FlClash-{os.environ["VERSION"]}-linux-{arch}.tar.gz'
          with tarfile.open(archive, 'w:gz') as output:
              for entry in sorted(bundle.iterdir()):
                  output.add(entry, arcname=entry.name)
          print(f'Created {archive}')
          PY

      - name: Collect complete platform artifacts
        shell: python
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          import os
          import pathlib
          import shutil

          platform = os.environ['PLATFORM']
          arch = os.environ['ARCH']
          version = os.environ['VERSION']
          if platform == 'android':
              names = [f'FlClash-{version}-android-{abi}.apk' for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64')]
          else:
              suffixes = {'windows': ('-setup.exe', '.zip'), 'linux': ('.deb', '.rpm', '.AppImage', '.tar.gz'), 'macos': ('.dmg',)}[platform]
              names = [f'FlClash-{version}-{platform}-{arch}{suffix}' for suffix in suffixes]
          destination = pathlib.Path('release-artifacts')
          destination.mkdir()
          for name in names:
              matches = list(pathlib.Path('dist').rglob(name))
              if len(matches) != 1 or not matches[0].is_file() or matches[0].stat().st_size == 0:
                  raise SystemExit(f'Expected exactly one nonempty {name}, found {matches}')
              shutil.copyfile(matches[0], destination / name)
          if platform == 'android':
              shutil.copyfile(pathlib.Path(os.environ['RUNNER_TEMP']) / 'ANDROID-SIGNING.txt', destination / 'ANDROID-SIGNING.txt')

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./release-artifacts/*
          if-no-files-found: error

  upload:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: [metadata, build, dart, plugins, go, android, rust, windows-helper-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Generate AUR source package
        if: env.IS_STABLE == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tool/release_aur.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --dist dist --output dist/aur

      - name: Verify release assets and generate SHA256SUMS
        id: assets
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib

          version = os.environ['VERSION']
          dist = pathlib.Path('dist')
          expected = {f'FlClash-{version}-android-{arch}.apk' for arch in ('arm64-v8a', 'armeabi-v7a', 'x86_64')}
          for arch in ('amd64', 'arm64'):
              expected.update(f'FlClash-{version}-windows-{arch}{suffix}' for suffix in ('-setup.exe', '.zip'))
              expected.update(f'FlClash-{version}-linux-{arch}{suffix}' for suffix in ('.deb', '.rpm', '.AppImage', '.tar.gz'))
              expected.add(f'FlClash-{version}-macos-{arch}.dmg')
          expected.add('ANDROID-SIGNING.txt')
          if os.environ['IS_STABLE'] == 'true':
              expected.add(f'flclash-freecat-bin-{version}.tar.gz')
          actual = {path.name for path in dist.iterdir() if path.is_file() and path.name != 'SHA256SUMS'}
          if actual != expected:
              raise SystemExit(f'Release assets do not match: missing={sorted(expected - actual)}, unexpected={sorted(actual - expected)}')
          with (dist / 'SHA256SUMS').open('w', encoding='utf-8') as output:
              for name in sorted(expected):
                  path = dist / name
                  if path.stat().st_size == 0:
                      raise SystemExit(f'Empty release asset: {name}')
                  digest = hashlib.sha256()
                  with path.open('rb') as source:
                      for block in iter(lambda: source.read(1024 * 1024), b''):
                          digest.update(block)
                  output.write(f'{digest.hexdigest()}  {name}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('files<<RELEASE_ASSETS\n')
              for name in sorted(expected | {'SHA256SUMS'}):
                  output.write(f'{dist / name}\n')
              output.write('RELEASE_ASSETS\n')
          PY

      - name: Generate release notes
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          {
            printf '# FlClash-FreeCat %s\n\n' "$VERSION"
            cat .github/release_notes.md
            printf '\n## Android signing for this build\n\n'
            cat dist/ANDROID-SIGNING.txt
            printf '\nBuilt from [%s](%s/%s/tree/%s).\n' "$RELEASE_TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } > release.md

      - name: Publish release in this repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ env.IS_STABLE != 'true' }}
          fail_on_unmatched_files: true
          files: ${{ steps.assets.outputs.files }}
          body_path: ./release.md
